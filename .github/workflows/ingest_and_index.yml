# ─────────────────────────────────────────────────────────────────────────────
# BlueRingsLabs · awensome_cybersecurity — Automated Ingestion Pipeline (Issue #7)
#
# On every push to `main` (i.e., right after a contributor PR is merged):
#   1. Detect raw Markdown submissions dropped in the repository root (/)
#   2. Sanitize + AI-classify them with Gemini 2.5 Flash (google-genai SDK)
#   3. Route each file into <domain>/<subdomain>/<YYYY>_<slug>.md
#   4. Regenerate index.json, index.yaml and the README.md resource table
#   5. Commit & push the organized structure back to main
#
# Also supports: manual dispatch, scheduled full re-index, and a safe
# "preview" mode on pull requests that only reports what WOULD happen.
# ─────────────────────────────────────────────────────────────────────────────
name: 🤖 Ingest, Classify & Auto-Index

on:
  push:
    branches: [main]
  pull_request: {}                      # preview-only validation on contributor PRs
  workflow_dispatch:                    # manual "Run pipeline now" button
    inputs:
      force_reindex:
        description: "Rebuild catalogs even if no new submissions exist"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"                 # weekly Monday safety-net full re-index

permissions:
  contents: write                       # required to commit the organized tree back to main

concurrency:
  group: ingest-and-index-${{ github.ref }}
  cancel-in-progress: false             # never lose an ingestion run mid-flight

jobs:
  # ───────────────────────────────────────────────────────────────
  # Preview / guard job for pull requests (read-only, never commits)
  # ───────────────────────────────────────────────────────────────
  pr-preview:
    name: 🔍 Preview ingestion (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r .github/scripts/requirements-pipeline.txt

      - name: Dry-run classifier (offline heuristic — no secrets needed)
        run: |
          python .github/scripts/classify_and_index.py --offline --dry-run | tee preview.log
          echo "### 🤖 Ingestion preview" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat preview.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate catalog consistency
        run: python .github/scripts/generate_catalog.py --check || echo "::warning::Catalog drift detected — it will be fixed automatically on merge."

  # ───────────────────────────────────────────────────────────────
  # Production pipeline: runs only on pushes to main (+ manual/schedule)
  # ───────────────────────────────────────────────────────────────
  ingest-and-index:
    name: 🚚 Ingest, classify & auto-index
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements-pipeline.txt

      - name: Detect raw root submissions
        id: detect
        shell: bash
        run: |
          shopt -s nullglob
          found=()
          for f in *.md *.markdown *.txt; do
            case "$f" in
              README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|LICENSE|CHANGELOG.md|SECURITY.md) continue ;;
            esac
            found+=("$f")
          done
          if [ ${#found[@]} -gt 0 ]; then
            echo "has_new=true"  >> "$GITHUB_OUTPUT"
            printf '📥 New submission(s): %s\n' "${found[*]}"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "No raw submissions waiting in the repository root."
          fi

      - name: Run ingestion pipeline (sanitize → Gemini classify → route → index)
        if: steps.detect.outputs.has_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MAX_BATCH_FILES: "12"          # free-tier friendly chunking (10–15 files/call)
          MIN_REQUEST_INTERVAL: "5"      # ≤ 12 RPM → respects the 15 RPM quota ceiling
        run: python .github/scripts/classify_and_index.py --verbose | tee ingest.log

      - name: Rebuild catalogs (idempotent safety net)
        run: python .github/scripts/generate_catalog.py

      - name: Surface pipeline log in run summary
        if: always()
        shell: bash
        run: |
          if [ -f ingest.log ]; then
            {
              echo "### 🤖 Pipeline report"
              echo '```'
              tail -n 120 ingest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit & push organized structure
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(index): auto-organize submissions and rebuild catalogs [skip ci]"
          branch: main
          commit_user_name: "BlueRingsLabs Bot"
          commit_user_email: "bot@blueringslabs.dev"
          file_pattern: >-
            *.md *.txt *.markdown
            01_literature/* 02_papers/* 03_web_and_posts/*
            index.json index.yaml README.md
          push_options: "--no-verify"
