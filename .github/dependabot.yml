# Keep GitHub Actions and Python dependencies current. Grouped minor/patch
# bumps keep the PR volume low; majors come through individually for review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        update-types: [minor, patch]
