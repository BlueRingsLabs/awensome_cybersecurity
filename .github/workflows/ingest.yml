# Automated ingestion, enrichment and catalog regeneration.
#
# On a push that lands raw submissions in inbox/ (after a maintainer merges a
# contribution) this classifies and files them, regenerates every derived
# artefact and commits the result. Dispatched by hand it can also:
#
#   * mode: enrich    -- ingest, then classify every pending library resource
#                        through the Google AI Studio -> Groq rotation (ADR-0008),
#                        committing progress after every chunk;
#   * mode: preflight -- only discover and validate every catalog model against
#                        the live APIs and print the verdicts; nothing is
#                        committed (safe to run on any branch).
#
# It is intentionally separate from CI: CI gates correctness on every PR; this
# job mutates the repository and therefore needs contents:write, granted to this
# workflow alone. Both provider keys come from the `awesome-cyber` deployment
# environment (and, as a fallback, repository secrets). They are required: a
# missing key fails the job before any work starts, and a rejected key fails
# it at model discovery. Key values are never printed.
name: Ingest and index

on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - "schema/taxonomy.yaml"
      - "schema/llm-models.yaml"
      - "src/cyberkb/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest = file inbox/ only; enrich = ingest + enrich pending resources; preflight = verify providers and models only (no commit)"
        type: choice
        options: [ingest, enrich, preflight]
        default: ingest
      limit:
        description: "enrich: attempt at most N resources in one chunk (blank = no limit, chunked until done)"
        type: string
        default: ""
      max_seconds:
        description: "enrich: total time budget in seconds; progress is committed after every chunk"
        type: string
        default: "19800"

# Serialise runs so two ingestions never race on the catalog or the ledger.
concurrency:
  group: ingest-and-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    name: Ingest, enrich and rebuild catalogs
    runs-on: ubuntu-latest
    # A full enrichment is paced to the providers' free-tier limits and can run
    # for hours. The `max_seconds` budget (default 5.5 h) governs it and every
    # chunk is committed as it finishes; this timeout is only a backstop.
    timeout-minutes: 350
    environment: awesome-cyber
    permissions:
      contents: write # commits the regenerated library, catalogs, ledger and reports
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'ingest' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out the repository
        # This job commits its results, so it deliberately keeps the checkout
        # credentials to push; full history lets a rejected push be rebased.
        # No artifacts are uploaded here.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Require both provider keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${GEMINI_API_KEY}" ]; then missing+=(GEMINI_API_KEY); fi
          if [ -z "${GROQ_API_KEY}" ]; then missing+=(GROQ_API_KEY); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]} (set them in the awesome-cyber environment)."
            exit 1
          fi
          echo "Both provider keys are present (values are never printed)."

      - name: Configure the committer
        if: env.MODE != 'preflight'
        run: |
          git config user.name "Gonzalo Romero"
          git config user.email "deeprat.tec@gmail.com"

      - name: Preflight (discover and validate every catalog model)
        if: env.MODE == 'preflight'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          uv run cyberkb preflight \
            --run-id "gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-preflight" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Ingest inbox and rebuild catalogs
        if: env.MODE != 'preflight'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          uv run cyberkb ingest \
            --run-id "gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ingest" \
            --summary "${GITHUB_STEP_SUMMARY}"
          .github/scripts/commit-progress.sh "ingest"

      - name: Enrich pending resources (chunked, committed as it goes)
        id: enrich
        if: env.MODE == 'enrich'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Passed via env (never interpolated into the script) so a dispatch
          # input cannot inject shell.
          ENRICH_LIMIT: ${{ inputs.limit }}
          ENRICH_MAX_SECONDS: ${{ inputs.max_seconds }}
          CHUNK_SECONDS: "1200"
        run: |
          set -euo pipefail
          is_int() { [[ "$1" =~ ^[1-9][0-9]*$ ]]; }
          budget="${ENRICH_MAX_SECONDS:-19800}"
          if ! is_int "${budget}"; then
            echo "::error::max_seconds must be a positive integer, got '${budget}'."
            exit 1
          fi
          if [ -n "${ENRICH_LIMIT}" ] && ! is_int "${ENRICH_LIMIT}"; then
            echo "::error::limit must be a positive integer, got '${ENRICH_LIMIT}'."
            exit 1
          fi
          start="$(date +%s)"
          chunk=0
          rc=5
          while [ "${rc}" -eq 5 ]; do
            left=$(( budget - ($(date +%s) - start) ))
            if [ "${left}" -lt 60 ]; then
              echo "Time budget spent; stopping after ${chunk} chunk(s)."
              break
            fi
            chunk=$(( chunk + 1 ))
            slice=$(( left < CHUNK_SECONDS ? left : CHUNK_SECONDS ))
            args=(--max-seconds "${slice}" --summary "${GITHUB_STEP_SUMMARY}"
                  --run-id "gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-enrich-c${chunk}")
            if [ -n "${ENRICH_LIMIT}" ]; then args+=(--limit "${ENRICH_LIMIT}"); fi
            set +e
            uv run cyberkb enrich "${args[@]}"
            rc=$?
            set -e
            .github/scripts/commit-progress.sh "enrich chunk ${chunk}"
            # A limit bounds one chunk: honour it as the whole run.
            if [ -n "${ENRICH_LIMIT}" ]; then break; fi
          done
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "chunks=${chunk}" >> "${GITHUB_OUTPUT}"

      - name: Fail if enrichment is incomplete
        if: env.MODE == 'enrich' && steps.enrich.outputs.exit_code != '0'
        env:
          ENRICH_EXIT: ${{ steps.enrich.outputs.exit_code }}
        run: |
          case "${ENRICH_EXIT}" in
            5) reason="the time or resource budget ended with work left (re-dispatch to continue)" ;;
            6) reason="no model capacity left (quotas exhausted or models failing; see the run report)" ;;
            *) reason="enrich exited with code ${ENRICH_EXIT}" ;;
          esac
          echo "::error::Enrichment is incomplete: ${reason}. Progress so far is committed; the ledger is docs/audit/enrich-state.json."
          exit 1
