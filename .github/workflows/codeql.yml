# CodeQL static analysis for the Python tooling and the GitHub Actions workflows.
#
# This is the single, version-controlled CodeQL configuration (the "advanced"
# setup). It analyses every language present in the repository — `python` (the
# cyberkb engine) and `actions` (these workflow files) — with the stronger
# `security-extended` query suite.
#
# NOTE: GitHub rejects an advanced workflow's results while CodeQL *default
# setup* is enabled for the repository ("CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled"). The
# one-time maintainer action is to disable default setup in Settings → Code
# security → Code scanning, after which this workflow is the sole source of
# truth and covers both languages. See docs/adr/0006 and the operations runbook.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
