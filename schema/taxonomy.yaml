# =============================================================================
# awesome_cybersecurity -- knowledge base taxonomy (v2)
# =============================================================================
#
# This file is the single source of truth for how resources are organised.
# Every consumer reads it: the heuristic classifier, the LLM prompt and
# response schema, the JSON Schemas under schema/, the catalog and the
# generated README pages. Change it here and run `cyberkb build`.
#
# Design (see docs/adr/0002-faceted-taxonomy.md):
#   * ONE primary `category` per resource (it decides the folder).
#   * Orthogonal facets live in front matter: `format`, `language`, `tags`.
#   * Categories are grounded in two public bodies of knowledge so the
#     library maps onto how industry and academia already reason:
#       - CyBOK v1.1 Knowledge Areas  (https://www.cybok.org/knowledgebase1_1/)
#       - NICE Framework v1.0.0 work role categories (NIST SP 800-181r1)
#   * Keyword weights feed the offline classifier: strong = 5, medium = 2,
#     weak = 1. Phrases are matched as whole token sequences, case and accent
#     insensitive, so "Active Directory", "active_directory" and
#     "active-directory" are the same signal.
# =============================================================================

version: 2

cybok_knowledge_areas:
  AAA: Authentication, Authorisation & Accountability
  AB: Adversarial Behaviours
  AC: Applied Cryptography
  C: Cryptography
  CPS: Cyber-Physical Systems Security
  DSS: Distributed Systems Security
  F: Forensics
  HF: Human Factors
  HS: Hardware Security
  LR: Law & Regulation
  MAT: Malware & Attack Technologies
  NS: Network Security
  OSV: Operating Systems & Virtualisation Security
  PLT: Physical Layer & Telecommunications Security
  POR: Privacy & Online Rights
  RMG: Risk Management & Governance
  SOIM: Security Operations & Incident Management
  SS: Software Security
  SSL: Secure Software Lifecycle
  WAM: Web & Mobile Security

nice_categories:
