# Automated ingestion and catalog regeneration.
#
# When raw submissions land in inbox/ on the default branch (after a
# maintainer merges a contribution), this workflow classifies and files them,
# regenerates every derived artefact and commits the result back.
#
# It is intentionally separate from CI: CI gates correctness on every PR;
# this job mutates the repository and therefore needs contents:write, which is
# granted to this workflow alone and nothing else.
name: Ingest and index

on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - "schema/taxonomy.yaml"
      - "src/cyberkb/**"
  workflow_dispatch: {}

# Serialise runs so two ingestions never race on the catalog.
concurrency:
  group: ingest-and-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest inbox submissions and rebuild catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commits the regenerated library and catalogs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out the repository
        # This job commits the regenerated catalogs, so it deliberately keeps
        # the checkout credentials to push. No artifacts are uploaded here.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Ingest inbox and rebuild catalogs
        env:
          # Optional: when unset, classification falls back to the offline
          # heuristic and the pipeline still completes.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run cyberkb ingest

      - name: Verify the result passes policy
        run: uv run cyberkb check

      - name: Commit and push regenerated catalogs
        run: |
          git config user.name "Gonzalo Romero"
          git config user.email "deeprat.tec@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(library): ingest submissions and regenerate catalogs [skip ci]"
            git push
          fi
