# .github/workflows/ingest_and_index.yml
#
# Automated ingestion, AI classification and index regeneration for
# BlueRingsLabs/awensome_cybersecurity.
#
# On every push to `main` (i.e. right after a contributor PR is merged):
#   1. Detect raw Markdown files uploaded to the repository root.
#   2. Run the Gemini-powered classifier (.github/scripts/classify_and_index.py)
#      which sanitizes, routes and renames them into the domain taxonomy.
#   3. Regenerate index.json, index.yaml and the README AUTO-INDEX block.
#   4. Commit and push the organized structure back to `main`.
#
# Required repository secret:
#   GEMINI_API_KEY  - Google AI Studio API key (gemini-2.5-flash).

name: Ingest, Classify & Index

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One pipeline run at a time; never interleave index rewrites.
concurrency:
  group: ingest-and-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-and-index:
    name: Ingest root submissions and rebuild catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pyyaml

      - name: Count raw submissions in repository root
        id: detect
        run: |
          count=$(find . -maxdepth 1 -name '*.md' \
            ! -name 'README.md' \
            ! -name 'CONTRIBUTING.md' \
            ! -name 'CODE_OF_CONDUCT.md' \
            ! -name 'SECURITY.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Raw Markdown files pending ingestion: $count"

      - name: Run AI classification and index regeneration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          KB_BATCH_SIZE: "12"
          KB_MIN_CALL_INTERVAL_SEC: "5"
          KB_MAX_RETRIES: "5"
        # The script exits non-zero only if it cannot initialize the client
        # while raw files exist; indexes are still regenerated as a fallback.
        run: python .github/scripts/classify_and_index.py

      - name: Rebuild catalogs deterministically (idempotent safety net)
        run: python .github/scripts/build_index.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(index): auto-ingest, classify and regenerate catalogs [skip ci]"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pipeline summary
        if: always()
        run: |
          echo "### Ingestion pipeline summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raw files detected at start: ${{ steps.detect.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Catalogs regenerated: \`index.json\`, \`index.yaml\`, README AUTO-INDEX block" >> "$GITHUB_STEP_SUMMARY"
