formats:
  - id: book
    name: Book
    description: Long-form book or handbook, usually hundreds of pages.
  - id: guide
    name: Guide
    description: Structured technical guide, tutorial or walkthrough.
  - id: article
    name: Article
    description: Blog post, essay or short web article.
  - id: paper
    name: Paper
    description: Research paper, whitepaper or formal report.
  - id: course-notes
    name: Course notes
    description: Study notes, course or certification preparation material.
  - id: cheatsheet
    name: Cheat sheet
    description: Dense quick-reference of commands, syntax or techniques.
  - id: checklist
    name: Checklist
    description: Itemised checklist for assessments, audits or hardening.
  - id: playbook
    name: Playbook
    description: Operational playbook or runbook for a defined process.
  - id: reference
    name: Reference
    description: Curated list, tool catalogue, link collection or template.

languages:
  - id: en
    name: English
  - id: es
    name: Spanish
  - id: pt
    name: Portuguese
  - id: und
    name: Undetermined

