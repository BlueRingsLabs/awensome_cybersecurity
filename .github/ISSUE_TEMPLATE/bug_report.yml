name: Bug report
description: Report a defect in the cyberkb engine, CI or catalogs.
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cyberkb version / commit
    validations:
      required: false
